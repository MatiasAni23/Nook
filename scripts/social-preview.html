<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Diseño de la imagen al compartir Pinwi</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #f7f4fb; color: #282333; font-family: Arial, sans-serif; }
      .preview { position: relative; width: 100%; height: 100%; padding: 64px; }
      .brand { display: flex; align-items: center; gap: 14px; height: 64px; }
      .brand-mark { height: 64px; width: auto; }
      .brand-wordmark { height: 44px; width: auto; }
      h1 { margin: 52px 0 22px; font-size: 59px; font-weight: 700; line-height: 1.12; letter-spacing: -2.5px; }
      h1 span { color: #6942bd; }
      .description { width: 530px; margin: 0; color: #544b61; font-size: 25px; line-height: 1.5; }
      .address { position: absolute; bottom: 62px; left: 64px; margin: 0; color: #60468c; font-size: 22px; font-weight: 600; }
      .photo { position: absolute; top: 48px; right: 48px; width: 450px; height: 534px; border-radius: 24px; object-fit: cover; object-position: 55% center; }
    </style>
  </head>
  <body>
    <!-- Fuente editable. Renderizar a JPEG de 1200 × 630 y guardar en public/social/.
         Al cambiar la imagen publicada, usar un nombre nuevo y actualizar index.html. -->
    <main class="preview">
      <div class="brand" aria-label="Pinwi">
        <img class="brand-mark" src="../assets/pinwi-mark.svg" alt="" />
        <img class="brand-wordmark" src="../assets/pinwi-wordmark.svg" alt="" />
      </div>
      <h1>Encuentra tu lugar.<br /><span>Hazlo tuyo.</span></h1>
      <p class="description">Espacios para estudiar y trabajar.<br />Bibliotecas, cafés y coworking en Chile.</p>
      <p class="address">pinwi.cl</p>
      <img class="photo" src="../assets/landing-study-space.jpg" alt="Espacio de estudio ilustrativo con libros y luz natural" />
    </main>
  </body>
</html>
